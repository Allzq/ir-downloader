name: '📦 دانلود و ذخیره در مخزن (پشتیبانی از Steam Workshop)'

on:
  workflow_dispatch:
    inputs:
      file_urls:
        description: '🔗 لینک فایل‌ها (با کاما جدا کنید) مثال: url1,url2,url3'
        required: true
        type: string
      custom_names:
        description: '📝 نام دلخواه (اختیاری، با کاما جدا، بدون پسوند) مثال: film,ahang'
        required: false
        type: string
        default: ''
      password:
        description: '🔐 رمز فایل فشرده (اختیاری)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 دریافت کد مخزن
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # برای جلوگیری از مشکل تاریخچه

      - name: ⚙️ نصب ابزارها
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full file aria2 curl python3 python3-pip
          pip3 install requests --break-system-packages || pip3 install requests

      - name: 🔧 تنظیم بافر HTTP
        run: |
          git config --global http.postBuffer 524288000
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 📥 پردازش و دانلود فایل‌ها (با پشتیبانی از Steam Workshop)
        run: |
          set -e  # در صورت بروز خطا متوقف شود (برای دیباگ)
          
          # آماده‌سازی لیست لینک‌ها
          echo "${{ github.event.inputs.file_urls }}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' > /tmp/urls.txt
          TOTAL_URLS=$(wc -l < /tmp/urls.txt)
          echo "🔹 تعداد کل لینک‌ها: $TOTAL_URLS"

          # آماده‌سازی نام‌های دلخواه
          IFS=',' read -ra NAME_ARRAY <<< "${{ github.event.inputs.custom_names }}"
          for idx in "${!NAME_ARRAY[@]}"; do
            NAME_ARRAY[$idx]=$(echo "${NAME_ARRAY[$idx]}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          done

          # ---------- اسکریپت کمکی برای Steam Workshop ----------
          cat > /tmp/steam_download.py << 'PYEOF'
          import sys, re, requests, os

          def download_steam_workshop(url, output_path):
              match = re.search(r'[?&]id=(\d+)', url)
              if not match:
                  print(f"❌ شناسه آیتم در لینک یافت نشد: {url}")
                  return False
              item_id = match.group(1)

              api_url = "https://api.steampowered.com/ISteamRemoteStorage/GetPublishedFileDetails/v1/"
              payload = {"itemcount": 1, f"publishedfileids[0]": item_id}
              try:
                  resp = requests.post(api_url, data=payload, timeout=30)
                  resp.raise_for_status()
                  data = resp.json()
                  details = data.get("response", {}).get("publishedfiledetails", [])
                  if not details:
                      print(f"❌ جزئیاتی برای آیتم {item_id} یافت نشد")
                      return False
                  # بررسی حذف شده بودن آیتم
                  if details[0].get("result") != 1:
                      print(f"❌ آیتم {item_id} در دسترس نیست (شاید حذف شده باشد)")
                      return False
                  file_url = details[0].get("file_url")
                  filename = details[0].get("filename")
                  if not file_url:
                      print(f"❌ لینک دانلود برای آیتم {item_id} موجود نیست")
                      return False
                  if not filename:
                      filename = f"workshop_{item_id}.bin"

                  print(f"✅ دریافت لینک دانلود: {file_url}")
                  print(f"📄 نام فایل اصلی: {filename}")

                  r = requests.get(file_url, stream=True)
                  r.raise_for_status()
                  with open(output_path, "wb") as f:
                      for chunk in r.iter_content(chunk_size=8192):
                          if chunk:
                              f.write(chunk)
                  # نام واقعی فایل را در یک فایل متنی ذخیره می‌کنیم تا بعداً استفاده شود
                  with open(output_path + ".filename.txt", "w") as nf:
                      nf.write(filename)
                  print(f"💾 فایل ذخیره شد: {output_path}")
                  return True
              except Exception as e:
                  print(f"❌ خطا در ارتباط با API استیم: {e}")
                  return False

          if __name__ == "__main__":
              if len(sys.argv) != 3:
                  sys.exit(1)
              url = sys.argv[1]
              out = sys.argv[2]
              success = download_steam_workshop(url, out)
              sys.exit(0 if success else 1)
          PYEOF

          COUNTER=0
          SUCCESSFUL_FILES=0
          while IFS= read -r URL; do
            [ -z "$URL" ] && continue
            COUNTER=$((COUNTER+1))
            echo ""
            echo "============================================================"
            echo "🔽 [${COUNTER}/${TOTAL_URLS}] شروع پردازش: $URL"
            echo "============================================================"

            # ----- مرحله ۱: تعیین نام پایه -----
            if [ -n "${NAME_ARRAY[$((COUNTER-1))]}" ]; then
              BASE_NAME="${NAME_ARRAY[$((COUNTER-1))]}"
              echo "🏷️ نام دلخواه: $BASE_NAME"
            else
              BASE_NAME=""
            fi

            TEMP_FILE="/tmp/download_${COUNTER}.tmp"
            rm -f "$TEMP_FILE"

            # ----- مرحله ۲: دانلود -----
            if echo "$URL" | grep -q "steamcommunity\.com.*filedetails"; then
              echo "🎮 لینک Steam Workshop تشخیص داده شد."
              if python3 /tmp/steam_download.py "$URL" "$TEMP_FILE"; then
                # نام واقعی فایل را از فایل کناری می‌خوانیم
                if [ -f "${TEMP_FILE}.filename.txt" ]; then
                  REAL_NAME=$(cat "${TEMP_FILE}.filename.txt")
                  rm -f "${TEMP_FILE}.filename.txt"
                  if [ -n "$BASE_NAME" ]; then
                    FINAL_BASE="$BASE_NAME"
                  else
                    # حذف پسوند احتمالی از نام واقعی
                    FINAL_BASE="${REAL_NAME%.*}"
                  fi
                else
                  FINAL_BASE="${BASE_NAME:-steam_$COUNTER}"
                fi
                echo "✅ دانلود از Steam با موفقیت انجام شد."
              else
                echo "❌ خطا در دانلود از Steam Workshop. رد کردن این لینک..."
                continue
              fi
            else
              # دانلود معمولی با aria2c
              echo "🌐 لینک معمولی - شروع دانلود با aria2c"
              # اگر نام دلخواه داریم استفاده کن، وگرنه از URL استخراج کن
              if [ -z "$BASE_NAME" ]; then
                # استخراج نام از هدر یا URL
                BASE_NAME=$(curl -sI "$URL" | grep -i 'Content-Disposition' | sed -n 's/.*filename="\([^"]*\)".*/\1/p')
                if [ -z "$BASE_NAME" ]; then
                  BASE_NAME=$(basename "$URL" | sed 's/\?.*//' | sed 's/%20/ /g')
                fi
                if [ -z "$BASE_NAME" ]; then
                  BASE_NAME="file_$COUNTER"
                fi
                BASE_NAME="${BASE_NAME%.*}"  # بدون پسوند
              fi
              FINAL_BASE="$BASE_NAME"
              
              MAX_RETRIES=5
              RETRY=0
              SUCCESS=false
              while [ $RETRY -lt $MAX_RETRIES ] && [ "$SUCCESS" = false ]; do
                if [ $RETRY -gt 0 ]; then
                  echo "⚠️ تلاش مجدد $RETRY/$MAX_RETRIES ..."
                  sleep 10
                fi
                aria2c --user-agent="Mozilla/5.0" --max-connection-per-server=4 --split=4 \
                       --continue=true --retry-wait=10 --max-tries=1 --timeout=60 \
                       --console-log-level=error -o "$TEMP_FILE" "$URL" && SUCCESS=true
                RETRY=$((RETRY+1))
              done
              if [ "$SUCCESS" = false ]; then
                echo "❌ دانلود ناموفق: $URL"
                continue
              fi
            fi

            # بررسی وجود فایل دانلود شده
            if [ ! -f "$TEMP_FILE" ] || [ $(stat -c%s "$TEMP_FILE") -eq 0 ]; then
              echo "❌ فایل دانلود شده خالی یا وجود ندارد."
              continue
            fi

            # ----- مرحله ۳: تشخیص پسوند واقعی -----
            REAL_MIME=$(file -b --mime-type "$TEMP_FILE")
            EXT=""
            case "$REAL_MIME" in
              video/mp4) EXT="mp4" ;; video/webm) EXT="webm" ;;
              video/x-matroska) EXT="mkv" ;; audio/mpeg) EXT="mp3" ;;
              audio/ogg) EXT="ogg" ;; image/jpeg) EXT="jpg" ;;
              image/png) EXT="png" ;; application/pdf) EXT="pdf" ;;
              application/zip) EXT="zip" ;;
              application/x-rar-compressed|application/vnd.rar) EXT="rar" ;;
              application/vnd.android.package-archive) EXT="apk" ;;
              *) EXT="" ;;
            esac

            if [ -n "$EXT" ]; then
              FINAL_FILENAME="${FINAL_BASE}.${EXT}"
            else
              FINAL_FILENAME="${FINAL_BASE}"
            fi
            # پاکسازی کاراکترهای غیرمجاز
            FINAL_FILENAME=$(echo "$FINAL_FILENAME" | sed 's/[\\/:*?"<>|]/_/g')
            mv "$TEMP_FILE" "$FINAL_FILENAME"
            echo "✅ فایل نهایی: $FINAL_FILENAME"

            # ----- مرحله ۴: دسته‌بندی و فشرده‌سازی (با نام فایل) -----
            FOLDER_NAME="${FINAL_FILENAME%.*}"
            MIME=$(file -b --mime-type "$FINAL_FILENAME")
            if [[ "$MIME" == video/* ]]; then CAT="video"
            elif [[ "$MIME" == audio/* ]]; then CAT="audio"
            elif [[ "$MIME" == image/* ]]; then CAT="image"
            elif [[ "$MIME" == application/pdf ]]; then CAT="document"
            else CAT="other"
            fi

            FINAL_DIR="downloads/$CAT/$FOLDER_NAME"
            mkdir -p "$FINAL_DIR"
            rm -f "$FINAL_DIR"/*.7z*

            ARCHIVE_NAME="${FOLDER_NAME}.7z"
            if [ -z "${{ github.event.inputs.password }}" ]; then
              7z a -mhe=on -mx=7 -md=128m -v90m "$FINAL_DIR/$ARCHIVE_NAME" "./$FINAL_FILENAME" > /dev/null
            else
              7z a -p"${{ github.event.inputs.password }}" -mhe=on -mx=7 -md=64m -v90m "$FINAL_DIR/$ARCHIVE_NAME" "./$FINAL_FILENAME" > /dev/null
            fi
            rm -f "$FINAL_FILENAME"
            echo "✅ آرشیو ایجاد شد: $FINAL_DIR/$ARCHIVE_NAME"

            # ----- مرحله ۵: commit و push تدریجی -----
            echo "📤 ارسال به مخزن..."
            git add "$FINAL_DIR/"
            if git diff --staged --quiet; then
              echo "⚠️ هیچ تغییر جدیدی برای commit وجود ندارد."
            else
              git commit -m "Add $FOLDER_NAME [$(date +'%Y-%m-%d %H:%M:%S')]"
              # جلوگیری از خطای push با pull --rebase
              git pull --rebase origin ${GITHUB_REF#refs/heads/} || true
              if git push origin HEAD:${GITHUB_REF#refs/heads/}; then
                echo "✅ Push موفقیت‌آمیز بود."
                SUCCESSFUL_FILES=$((SUCCESSFUL_FILES+1))
              else
                echo "❌ Push ناموفق! ممکن است نیاز به بررسی دسترسی باشد."
              fi
            fi
          done < /tmp/urls.txt

          echo ""
          echo "============================================================"
          echo "🎉 خلاصه: $SUCCESSFUL_FILES از $COUNTER فایل با موفقیت ذخیره و push شد."
          echo "============================================================"
          # اگر هیچ فایلی push نشد، با خطا خارج نشو (اجازه بده action سبز باشد)
